server.port=${PORT:8080}

# Secrets and model names come from environment variables, never from code.
kam.gemini.api-key=${GEMINI_API_KEY:}
kam.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
kam.gemini.stt-model=${GEMINI_STT_MODEL:gemini-3.1-flash-lite}
kam.gemini.tts-model=${GEMINI_TTS_MODEL:gemini-3.1-flash-tts-preview}
kam.gemini.tts-voice=${GEMINI_TTS_VOICE:Kore}
# -1 = omit thinkingConfig for lowest latency (2x faster responses).
kam.gemini.thinking-budget=${GEMINI_THINKING_BUDGET:-1}
